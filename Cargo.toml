[package]
name = "Rune"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "Typed serialization for Python."

[lib]
name = "rune"
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[dependencies]
itoa = "1.0.18"
pyo3 = { version = "0.29.3", features = ["auto-initialize", "extension-module"] }
rustc-hash = "2.1.3"
zmij = "1.0.23"

[dev-dependencies]
rstest = "0.27.0"
