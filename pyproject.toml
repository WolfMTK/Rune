[build-system]
requires = ["maturin>=1.16.0,<2"]
build-backend = "maturin"

[project]
name = "rune"
description = "Typed serialization for Python."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
]
dependencies = [
    "typing-extensions>=4.16.0",
]


[dependency-groups]
bench = [
    "cattrs==26.2.1",
    "mashumaro==3.23",
    "msgpack==1.2.4",
    "orjson==3.13.0",
    "ormsgpack==1.13.1",
    "pydantic==2.14.4",
    "python-rapidjson==1.26",
    "pysimdjson==8.0.0",
    "requests",
    "ujson==6.1.0",
    "msgspec==0.22.0"
]
lint = [
    "ruff>=0.17.1",
]
test = [
    "attrs>=26.1.0",
    "pytest>=9.1.1",
    "pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["rune", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.maturin]
module-name = "rune"
