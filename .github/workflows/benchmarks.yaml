name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks
      - run: uv sync --python 3.13 --group bench
      - name: Struct operations
        run: uv run python benchmarks/bench_structs.py
      - name: JSON encoding
        run: uv run python -m benchmarks.bench_encodings -p json
      - name: MessagePack encoding
        run: uv run python -m benchmarks.bench_encodings -p msgpack
      - name: Validation
        run: uv run python -m benchmarks.bench_validation
      - name: Garbage collection
        run: uv run python benchmarks/bench_gc.py
      - name: Large JSON
        run: uv run python benchmarks/bench_large_json.py
      - name: Library size
        run: uv run python benchmarks/bench_library_size.py
