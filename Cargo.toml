[package]
name = "Rune"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "Typed serialization for Python."

[lib]
name = "_rune"
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[dependencies]
pyo3 = { version = "0.29.3", features = ["auto-initialize", "extension-module"] }
